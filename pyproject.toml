[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muster"
version = "0.1.0"
description = "An autonomous shift coordinator that knows the law"
requires-python = ">=3.12"
dependencies = [
  "strands-agents==1.54.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "boto3>=1.34",
  "mcp>=1.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
muster-demo = "muster.demo:main"
muster-mcp = "muster.mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
muster = ["rulebook/data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = ["integration: hits live Bedrock and is billed"]
